# Dependabot: контролируемое обновление зависимостей через PR.
# Экшены в .github/workflows запинены к commit-SHA (supply-chain hardening) —
# без Dependabot такие пины «замёрзли» бы. Он еженедельно открывает PR с
# обновлением SHA (и комментария-версии), которые проходят обычный CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
