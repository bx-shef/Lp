name: Build & Validate

on:
  workflow_call:
    inputs:
      site-url:
        description: 'Canonical site URL (NUXT_PUBLIC_SITE_URL)'
        type: string
        default: 'https://offer.bx-shef.by'
      b24-form-id:
        type: string
        default: ''
      b24-form-secret:
        type: string
        default: ''
      b24-form-script-url:
        type: string
        default: ''
      metrika-id:
        type: string
        default: ''
      build-id:
        description: 'Git commit SHA for footer display (NUXT_PUBLIC_BUILD_ID)'
        type: string
        default: ''
      upload-artifact:
        description: 'Upload .output/public as artifact "site"'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NUXT_APP_BASE_URL: '/'
      NUXT_PUBLIC_SITE_URL: ${{ inputs.site-url }}
      NUXT_PUBLIC_BUILD_ID: ${{ inputs.build-id }}
      # GitHub GraphQL API — для contrib-heatmap на главной.
      # Токен создаётся Actions автоматически, вручную добавлять ничего не нужно.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Metrika: пустая строка безопасна — nuxt.config.ts фильтрует \D
      NUXT_PUBLIC_METRIKA_ID: ${{ inputs.metrika-id }}
      # B24-форма: НЕ задаём здесь, чтобы пустая строка не перебивала дефолты
      # nuxt.config.ts. Реальные значения выставляются в шаге ниже только
      # когда inputs ненулевые. Nuxt автоматически читает NUXT_PUBLIC_* из env.

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Страховка supply-chain: внешние экшены должны быть запинены к commit-SHA,
      # а не к плавающему тегу @vN (тег можно молча перевесить на вредоносный код).
      # Dependabot обновляет SHA через PR — этот guard ловит ручной откат к @vN.
      - name: Lint workflow pins (внешние экшены только по SHA)
        run: |
          BAD=$(grep -rnE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]+[^.][^@]+@v[0-9]' .github/workflows/ || true)
          if [ -n "$BAD" ]; then
            echo "ERR: плавающие теги @vN у внешних экшенов (нужен commit-SHA):"
            echo "$BAD"
            exit 1
          fi
          echo "OK: внешние экшены запинены к SHA"

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set B24 form env vars (skip when input is empty)
        run: |
          [ -n "$ID" ]  && echo "NUXT_PUBLIC_B24_FORM_ID=$ID"             >> $GITHUB_ENV || true
          [ -n "$SEC" ] && echo "NUXT_PUBLIC_B24_FORM_SECRET=$SEC"         >> $GITHUB_ENV || true
          [ -n "$URL" ] && echo "NUXT_PUBLIC_B24_FORM_SCRIPT_URL=$URL"     >> $GITHUB_ENV || true
        env:
          ID:  ${{ inputs.b24-form-id }}
          SEC: ${{ inputs.b24-form-secret }}
          URL: ${{ inputs.b24-form-script-url }}

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # generate (статика) вместо build (SSR) — CI и deploy идут одной тропой.
      - name: Generate (static)
        run: pnpm run generate

      - name: Validate output
        run: |
          test -f .output/public/index.html         || (echo "ERR: index.html missing" && exit 1)
          test -f .output/public/privacy/index.html || (echo "ERR: privacy missing" && exit 1)
          test -f .output/public/legal/index.html   || (echo "ERR: legal missing" && exit 1)
          test -s .output/public/og-image.png       || (echo "ERR: og-image.png missing or empty" && exit 1)
          test -f .output/public/CNAME              || (echo "ERR: CNAME missing" && exit 1)
          grep -q '<title>[^<]' .output/public/index.html         || (echo "ERR: index <title> пустой" && exit 1)
          grep -q '<title>[^<]' .output/public/privacy/index.html || (echo "ERR: privacy <title> пустой" && exit 1)
          grep -q '<title>[^<]' .output/public/legal/index.html   || (echo "ERR: legal <title> пустой" && exit 1)
          grep -q 'og:image'  .output/public/index.html           || (echo "ERR: og:image meta missing" && exit 1)
          grep -qF "rel=\"canonical\" href=\"$NUXT_PUBLIC_SITE_URL\"" .output/public/index.html || (echo "ERR: canonical в index.html не совпадает с NUXT_PUBLIC_SITE_URL=$NUXT_PUBLIC_SITE_URL" && exit 1)
          grep -q 'canonical' .output/public/privacy/index.html   || (echo "ERR: privacy canonical missing" && exit 1)
          grep -q 'canonical' .output/public/legal/index.html     || (echo "ERR: legal canonical missing" && exit 1)
          grep -q 'mc.yandex.ru/metrika/tag.js' .output/public/index.html || (echo "ERR: код Яндекс Метрики (inline-сниппет) отсутствует в index.html" && exit 1)
          grep -q 'build ' .output/public/index.html             || (echo "ERR: build-id missing in footer" && exit 1)
          grep -q 'bel.bitrix24.by' .output/public/index.html     || (echo "ERR: ссылка «Назначить созвон» (booking URL) отсутствует" && exit 1)
          grep -q 'currency-converter.bx-shef.by' .output/public/index.html || (echo "ERR: блок инструментов в футере не отрендерился" && exit 1)
          grep -q 'aria-label="GitHub"' .output/public/index.html || (echo "ERR: GitHub-кнопка в подвале отсутствует" && exit 1)
          # GitHub-граф рендерится только при наличии данных (v-if). Не блокируем
          # сборку (graceful degradation by design), но подсвечиваем annotation —
          # важно для cron-прогона: молчаливое исчезновение графа было бы незаметно.
          grep -q 'GitHub активность' .output/public/index.html \
            || echo "::warning::GitHub-граф отсутствует в index.html (нет GITHUB_TOKEN либо GitHub API недоступен). Сайт собран, секция активности скрыта."
          echo "OK: все обязательные артефакты на месте"

      - name: Upload artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: .output/public
          retention-days: 7
