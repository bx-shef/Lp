name: Build & Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        node: [ 22 ]

    env:
      # Кастомный домен bx-shef.by — base URL корневой, а не /repo/
      NUXT_APP_BASE_URL: '/'
      NUXT_PUBLIC_SITE_URL: 'https://bx-shef.by'
      # B24 form embed-параметры — это публичные идентификаторы (видны в HTML),
      # поэтому хранятся в Variables (vars), а не Secrets. Если переменные
      # не заданы в Repository → Settings → Variables — используется fallback
      # из nuxt.config.ts (форма Игоря Шевчика).
      NUXT_PUBLIC_B24_FORM_ID: ${{ vars.NUXT_PUBLIC_B24_FORM_ID }}
      NUXT_PUBLIC_B24_FORM_SECRET: ${{ vars.NUXT_PUBLIC_B24_FORM_SECRET }}
      NUXT_PUBLIC_B24_FORM_SCRIPT_URL: ${{ vars.NUXT_PUBLIC_B24_FORM_SCRIPT_URL }}
      # Яндекс Метрика. Если переменная не задана — используется дефолт из nuxt.config.ts
      NUXT_PUBLIC_METRIKA_ID: ${{ vars.NUXT_PUBLIC_METRIKA_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Generate
        run: pnpm run generate

      # Защита от деплоя пустой страницы / без OG
      - name: Validate output
        run: |
          test -f .output/public/index.html || (echo "ERR: index.html missing" && exit 1)
          test -f .output/public/og-image.png || (echo "ERR: og-image.png missing" && exit 1)
          test -f .output/public/CNAME || (echo "ERR: CNAME missing" && exit 1)
          grep -q '<title>[^<]' .output/public/index.html || (echo "ERR: <title> пустой или отсутствует" && exit 1)
          grep -q 'og:image' .output/public/index.html || (echo "ERR: og:image meta missing" && exit 1)
          grep -q 'mc.yandex.ru/metrika/tag.js' .output/public/index.html || (echo "ERR: Yandex Metrika script missing" && exit 1)
          echo "OK: артефакт валиден"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: .output/public
          retention-days: 7

  deploy-vps:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to VPS
    # Пропускаем если секрет не задан — безопасно для форков/PRs
    if: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - name: Download artifact
        # upload-artifact@v4 раскладывает файлы напрямую в path (без tar-обёртки)
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Verify dist not empty
        run: test "$(ls -A dist)" || (echo "ERR: dist/ пуст — rsync с --delete отменён" && exit 1)

      - name: Setup SSH
        env:
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          # DEPLOY_HOST_KEY — строка вида "hostname ssh-ed25519 AAAA..." из ssh-keyscan на доверенной машине.
          # Если не задан — fallback к keyscan (менее безопасно, MITM-риск).
          # Получить: ssh-keyscan -p PORT HOST | grep ed25519
          if [ -n "$DEPLOY_HOST_KEY" ]; then
            printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          fi

      - name: Backup current version on server
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cp -al ${{ secrets.DEPLOY_PATH }} ${{ secrets.DEPLOY_PATH }}.bak 2>/dev/null || true"

      - name: Sync to server
        run: |
          rsync -az --delete --checksum \
            -e "ssh -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=yes" \
            dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Verify deployment
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "test -f ${{ secrets.DEPLOY_PATH }}/index.html && echo OK \
              || (echo 'ERR: index.html не найден на сервере' && exit 1)"

      - name: Smoke test
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "curl -sf --max-time 10 http://localhost/ | grep -q 'og:image' \
              || (echo 'ERR: nginx не отдаёт страницу с og:image' && exit 1)"
