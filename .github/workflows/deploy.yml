name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Ежедневный пересбор, чтобы обновлять GitHub-граф контрибуций
  # (данные вмораживаются в статику при generate).
  # GitHub Actions — UTC; 22:00 UTC = 01:00 по Минску (UTC+3, без DST).
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      site-url: 'https://offer.bx-shef.by'
      # B24 form embed-параметры — публичные идентификаторы (видны в HTML),
      # хранятся в Variables (vars), а не Secrets. Если не заданы —
      # используется fallback из nuxt.config.ts (форма Игоря Шевчика).
      b24-form-id: ${{ vars.NUXT_PUBLIC_B24_FORM_ID }}
      b24-form-secret: ${{ vars.NUXT_PUBLIC_B24_FORM_SECRET }}
      b24-form-script-url: ${{ vars.NUXT_PUBLIC_B24_FORM_SCRIPT_URL }}
      # Если не задан — используется дефолт из nuxt.config.ts
      metrika-id: ${{ vars.NUXT_PUBLIC_METRIKA_ID }}
      build-id: ${{ github.sha }}
      upload-artifact: true

  deploy-vps:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to VPS
    steps:
      - name: Download artifact
        # upload-artifact@v4 раскладывает файлы напрямую в path (без tar-обёртки)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: dist

      - name: Verify dist not empty
        run: |
          test "$(ls -A dist)" || (echo "ERR: dist/ пуст — rsync с --delete отменён" && exit 1)

      - name: Setup SSH
        env:
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          # Через env:, а не inline ${{ }} — секрет не попадает в тело job-скрипта
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          # DEPLOY_HOST_KEY обязателен — строка вида "hostname ssh-ed25519 AAAA..."
          # Получить: ssh-keyscan -p PORT HOST | grep ed25519
          # Добавить в: Repository → Settings → Secrets → DEPLOY_HOST_KEY
          if [ -z "$DEPLOY_HOST_KEY" ]; then
            echo "ERR: DEPLOY_HOST_KEY secret не задан. Автоматический keyscan отключён (MITM-риск)."
            echo "Запустите: ssh-keyscan -p PORT HOST | grep ed25519 — и добавьте результат в секрет DEPLOY_HOST_KEY."
            exit 1
          fi
          printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts

      - name: Backup current version on server
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "rsync -a --delete --link-dest=${{ secrets.DEPLOY_PATH }} \
              --exclude='bitrix'      \
              --exclude='local'       \
              --exclude='personal'    \
              --exclude='support'     \
              --exclude='upload'      \
              --exclude='.access.php' \
              --exclude='.htaccess'   \
              --exclude='.htsecure'   \
              ${{ secrets.DEPLOY_PATH }}/ ${{ secrets.DEPLOY_PATH }}.bak/ 2>/dev/null || true"

      - name: Sync to server
        id: sync
        run: |
          rsync -az --delete --checksum \
            --exclude='bitrix'      \
            --exclude='local'       \
            --exclude='personal'    \
            --exclude='support'     \
            --exclude='upload'      \
            --exclude='.access.php' \
            --exclude='.htaccess'   \
            --exclude='.htsecure'   \
            -e "ssh -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=yes" \
            dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Verify deployment
        id: verify
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "test -f ${{ secrets.DEPLOY_PATH }}/index.html && echo OK \
              || (echo 'ERR: index.html не найден на сервере' && exit 1)"

      - name: Smoke test
        id: smoke
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "grep -q 'og:image' ${{ secrets.DEPLOY_PATH }}/index.html \
              || (echo 'ERR: og:image не найден в index.html' && exit 1)"

      - name: Rollback on failure
        if: failure() && (steps.sync.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "if test -d ${{ secrets.DEPLOY_PATH }}.bak; then \
                rsync -a --delete ${{ secrets.DEPLOY_PATH }}.bak/ ${{ secrets.DEPLOY_PATH }}/ \
                && echo 'OK: rollback выполнен из .bak' \
                || (echo 'ERR: rsync rollback не удался' && exit 1); \
              else echo 'WARN: .bak не найден, rollback пропущен'; fi"
