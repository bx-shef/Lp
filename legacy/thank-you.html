<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Спасибо — Игорь Шевчик</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #faf9f6;
    color: #1a1a1a;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.55;
  }
  .card {
    max-width: 520px;
    text-align: center;
  }
  .mark {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #eaf2ec;
    color: #2e5a3e;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin-bottom: 24px;
    font-weight: 700;
  }
  h1 {
    font-size: 32px;
    margin: 0 0 16px;
    letter-spacing: -0.02em;
  }
  p {
    color: #6b6b6b;
    font-size: 17px;
    margin: 0 0 12px;
  }
  a {
    color: #2e5a3e;
    text-decoration: none;
    font-weight: 600;
  }
  a:hover { text-decoration: underline; }
  .back {
    display: inline-block;
    margin-top: 28px;
    padding: 12px 22px;
    background: #1a1a1a;
    color: white;
    border-radius: 8px;
    font-size: 15px;
  }
  .back:hover { background: #2e5a3e; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="mark">✓</div>
  <h1>Получил вашу заявку</h1>
  <p>Прочитаю внимательно и отвечу в течение рабочего дня — на тот контакт, который вы указали.</p>
  <p>Если задача срочная — напишите в Telegram напрямую.</p>
  <a class="back" href="/">← Вернуться на главную</a>
</div>
</body>
</html>
